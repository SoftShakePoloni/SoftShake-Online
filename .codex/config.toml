[mcp_servers.shadcn-ui]
command = "npx"
args = ["-y", "@jpisnice/shadcn-ui-mcp-server"]
startup_timeout_sec = 60
default_tools_approval_mode = "prompt"

[mcp_servers.21st]
url = "https://21st.dev/api/mcp"
env_http_headers = { "x-api-key" = "API_KEY_21ST" }
enabled = false
default_tools_approval_mode = "prompt"
